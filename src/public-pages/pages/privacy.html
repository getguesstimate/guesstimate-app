<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy — Guesstimate</title>
    <meta name="description" content="Read the Guesstimate privacy policy." />
    <link href="{{canonical}}" rel="canonical" />
    <link href="/assets/favicon-2.png" rel="icon" type="image/png" />
    <link href="/landing.css" rel="stylesheet" />
    <link href="/legal.css" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">{{t:skip}}</a>
    {{header}}
    <main class="legal-page container" id="main-content" tabindex="-1">
      <article class="legal-document">
        <h1>Privacy Policy</h1>
        <p>Our privacy policy is hosted on iubenda.</p>
        <p>
          <a
            class="text-action"
            href="https://www.iubenda.com/privacy-policy/7790420"
            >Read the privacy policy <span aria-hidden="true">→</span></a
          >
        </p>
      </article>
    </main>
    {{footer}}
    <script src="/site.js" defer></script>
  </body>
</html>
