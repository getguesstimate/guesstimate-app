<header class="site-header">
  <div class="header-inner container">
    <a aria-label="{{t:nav.home}}" class="brand" href="{{homeUrl}}">
      <img alt="" height="24" src="/assets/new-logo-2.png" width="24" />
      <span>{{t:brand}}</span>
    </a>
    <nav aria-label="{{t:nav.main}}" class="desktop-navigation">
      <a href="/models"
        ><svg
          class="nav-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" /></svg
        ><span>{{t:nav.models}}</span></a
      >
      <a href="https://docs.getguesstimate.com/docs/Introduction"
        ><svg
          class="nav-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 5v15M12 5C8 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-5-1-9 1Z"
          /></svg
        ><span>{{t:nav.docs}}</span></a
      >
      <a href="{{pricingUrl}}"
        ><svg
          class="nav-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 10h18M7 15h4" /></svg
        ><span>{{t:nav.plans}}</span></a
      >
    </nav>
    {{languageMenu}}
    <details class="mobile-menu">
      <summary aria-label="{{t:nav.menu}}">
        <svg
          class="menu-open-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" /></svg
        ><svg
          class="menu-close-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </summary>
      <nav aria-label="{{t:nav.mobile}}" class="mobile-navigation">
        <a href="/models"
          ><svg
            class="nav-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" /></svg
          ><span>{{t:nav.models}}</span></a
        >
        <a href="https://docs.getguesstimate.com/docs/Introduction"
          ><svg
            class="nav-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 5v15M12 5C8 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-5-1-9 1Z"
            /></svg
          ><span>{{t:nav.docs}}</span></a
        >
        <a href="{{pricingUrl}}"
          ><svg
            class="nav-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 10h18M7 15h4" /></svg
          ><span>{{t:nav.plans}}</span></a
        >
      </nav>
    </details>
  </div>
</header>
