<header class="site-header">
  <div class="header-inner container">
    <a aria-label="{{t:nav.home}}" class="brand" href="{{homeUrl}}">
      <img alt="" height="24" src="/assets/new-logo-2.png" width="24" />
      <span>{{t:brand}}</span>
    </a>
    <nav aria-label="{{t:nav.main}}" class="desktop-navigation">
      <a href="/models"
        ><svg
          class="nav-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" /></svg
        ><span>{{t:nav.models}}</span></a
      >
      <a href="https://docs.getguesstimate.com/docs/Introduction"
        ><svg
          class="nav-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M12 5v15M12 5C8 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-5-1-9 1Z"
          /></svg
        ><span>{{t:nav.docs}}</span></a
      >
      <a href="{{pricingUrl}}"
        ><svg
          class="nav-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 10h18M7 15h4" /></svg
        ><span>{{t:nav.plans}}</span></a
      >
    </nav>
    {{languageMenu}}
    <button
      class="theme-toggle"
      type="button"
      hidden
      aria-label="{{t:theme.system}}"
      data-label-system="{{t:theme.system}}"
      data-label-light="{{t:theme.light}}"
      data-label-dark="{{t:theme.dark}}"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g data-theme-icon="system">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 4a8 8 0 0 0 0 16Z" fill="currentColor" stroke="none" />
        </g>
        <g data-theme-icon="light">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5" />
        </g>
        <g data-theme-icon="dark">
          <path d="M20.8 13.3A9 9 0 0 1 10.7 3.2 9 9 0 1 0 20.8 13.3Z" />
        </g>
      </svg>
    </button>
    <details class="mobile-menu">
      <summary aria-label="{{t:nav.menu}}">
        <svg
          class="menu-open-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" /></svg
        ><svg
          class="menu-close-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m6 6 12 12M6 18 18 6" />
        </svg>
      </summary>
      <nav aria-label="{{t:nav.mobile}}" class="mobile-navigation">
        <a href="/models"
          ><svg
            class="nav-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" /></svg
          ><span>{{t:nav.models}}</span></a
        >
        <a href="https://docs.getguesstimate.com/docs/Introduction"
          ><svg
            class="nav-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12 5v15M12 5C8 3 5 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-2-1-5-1-9 1Z"
            /></svg
          ><span>{{t:nav.docs}}</span></a
        >
        <a href="{{pricingUrl}}"
          ><svg
            class="nav-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 10h18M7 15h4" /></svg
          ><span>{{t:nav.plans}}</span></a
        >
      </nav>
    </details>
  </div>
</header>
