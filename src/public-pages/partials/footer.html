<footer class="site-footer">
  <div class="footer-inner container">
    <div class="footer-about">
      <p class="footer-name">{{t:brand}}</p>
      <p>{{t:footer.credit}}</p>
      {{languageNotice}}
    </div>
    <nav aria-label="{{t:footer.resources}}">
      <p class="footer-label">{{t:footer.resources}}</p>
      <a href="https://docs.getguesstimate.com/docs/Introduction"
        >{{t:nav.docs}}</a
      ><a href="https://github.com/getguesstimate/guesstimate-app"
        >{{t:footer.source}}</a
      ><a href="https://discord.gg/nsTnQTgtG6">{{t:footer.community}}</a>
    </nav>
    <nav aria-label="{{t:footer.legal}}">
      <p class="footer-label">{{t:brand}}</p>
      <a href="{{pricingUrl}}">{{t:nav.plans}}</a
      ><a href="/terms">{{t:footer.terms}}</a
      ><a href="/privacy">{{t:footer.privacy}}</a>
    </nav>
  </div>
</footer>
